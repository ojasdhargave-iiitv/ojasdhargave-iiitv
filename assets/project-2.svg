<svg width="280" height="190" viewBox="0 0 280 190" xmlns="http://www.w3.org/2000/svg"><style>
.serif{font-family:Georgia,'Times New Roman',serif}
.sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:'SFMono-Regular',Menlo,Consolas,'Courier New',monospace}
.cell{opacity:0;animation:pop .5s ease-out forwards}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.bar{transform-origin:bottom;animation:grow .8s ease-out both}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
.blink{animation:bl 1.4s steps(1) infinite}
@keyframes bl{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){
    *{animation:none!important}
    .cell{opacity:1!important}
}
</style><rect x=".5" y=".5" width="279" height="189" rx="12" fill="#f4f3ee" stroke="#e2e0d8"/><rect x="22" y="26" width="8" height="8" fill="#ee4035"/><text x="38" y="35" class="sans" font-size="14" font-weight="600" fill="#141414">saas-backend-ide</text><text x="22" y="70" class="sans" font-size="12.5" fill="#55554f">Code editor, compiler pipeline and</text><text x="22" y="89" class="sans" font-size="12.5" fill="#55554f">backend template engine. Cuts setup</text><text x="22" y="108" class="sans" font-size="12.5" fill="#55554f">time by 65%.</text><line x1="22" x2="258" y1="152" y2="152" stroke="#e2e0d8"/><text x="22" y="173" class="mono" font-size="10.5" fill="#6b6b66">TypeScript</text></svg>